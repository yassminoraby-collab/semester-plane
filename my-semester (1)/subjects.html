<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Semester — Subjects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="subjects">
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <div class="d-flex flex-column flex-grow-1 min-w-0">
    <div id="topbarSlot"></div>
    <main class="main-content">

      <!-- LIST VIEW -->
      <div id="subjectListView">
        <div class="page-head">
          <div>
            <h1>Subjects</h1>
            <p class="subtitle">Everything for each course, in one place.</p>
          </div>
        </div>
        <div class="row g-3" id="subjectGrid"></div>
      </div>

      <!-- DETAIL VIEW -->
      <div id="subjectDetailView" class="d-none">
        <div class="page-head">
          <div>
            <a class="link-quiet" href="subjects.html"><i class="bi bi-arrow-left me-1"></i>All subjects</a>
            <h1 class="mt-2" id="subjectDetailName">Subject</h1>
            <p class="subtitle" id="subjectDetailCredits"></p>
          </div>
          <span class="tag tag-sage" id="subjectDetailGradeTag" style="font-size:.82rem;padding:8px 14px;"></span>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <div class="card-soft card-pad h-100 d-flex flex-row align-items-center gap-3">
              <div class="ring" id="subjectDetailRing"></div>
              <div>
                <div class="section-title">Progress</div>
                <div class="text-faint small" id="subjectDetailTaskCount"></div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card-soft card-pad h-100">
              <div class="section-title">Next Deadline</div>
              <div class="text-faint small mt-1" id="subjectDetailNextDeadline"></div>
            </div>
          </div>
        </div>

        <ul class="nav nav-tabs ms-tabs mb-3" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabOverview" type="button">Overview</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabTasks" type="button">Tasks</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabAssessments" type="button">Assessments</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabNotes" type="button">Notes</button></li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="tabOverview">
            <div class="card-soft card-pad">
              <p class="text-muted-ink mb-0">This subject's progress, tasks and deadlines update automatically as you complete work across the app — nothing here is entered separately.</p>
            </div>
          </div>
          <div class="tab-pane fade" id="tabTasks">
            <div class="card-soft card-pad"><div id="subjectTaskList"></div></div>
          </div>
          <div class="tab-pane fade" id="tabAssessments">
            <div class="card-soft card-pad"><div id="subjectAssessmentList"></div></div>
          </div>
          <div class="tab-pane fade" id="tabNotes">
            <div class="card-soft card-pad">
              <label class="form-label" for="subjectNotesArea">Subject notes</label>
              <textarea class="form-control" id="subjectNotesArea" rows="8" placeholder="Write anything worth remembering about this subject…"></textarea>
              <div class="text-end mt-2">
                <button class="btn btn-sage btn-sm" onclick="msSaveSubjectNotes()">Save Notes</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/subjects.js"></script>
<script>
  msInitChrome("subjects");
  msSubjectsInit();
</script>
</body>
</html>
