<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Semester — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="progress">
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <div class="d-flex flex-column flex-grow-1 min-w-0">
    <div id="topbarSlot"></div>
    <main class="main-content">

      <div class="page-head">
        <div>
          <h1>Progress</h1>
          <p class="subtitle">A look at how your semester is going.</p>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <div class="card-soft card-pad h-100 d-flex flex-row align-items-center gap-3">
            <div class="ring" id="overallRing"></div>
            <div>
              <div class="stat-label">Overall Progress</div>
              <div class="text-faint small" id="overallSub"></div>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-6">
          <div class="stat-card h-100">
            <div class="stat-icon tint-sage"><i class="bi bi-check2-circle"></i></div>
            <div class="stat-label">Completed Tasks</div>
            <div class="stat-value" id="statCompletedTasks">0</div>
          </div>
        </div>
        <div class="col-md-4 col-6">
          <div class="stat-card h-100">
            <div class="stat-icon tint-beige"><i class="bi bi-hourglass-split"></i></div>
            <div class="stat-label">Pending Tasks</div>
            <div class="stat-value" id="statPendingTasks">0</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card h-100">
            <div class="stat-icon tint-rose"><i class="bi bi-exclamation-circle"></i></div>
            <div class="stat-label">Overdue</div>
            <div class="stat-value" id="statOverdueTasks">0</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card h-100">
            <div class="stat-icon tint-sage"><i class="bi bi-flag"></i></div>
            <div class="stat-label">Goals Completed</div>
            <div class="stat-value" id="statGoals" style="font-size:1.4rem;">0 / 0</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card h-100">
            <div class="stat-icon tint-beige"><i class="bi bi-clock-history"></i></div>
            <div class="stat-label">Study Hours</div>
            <div class="stat-value" id="statStudyHours" style="font-size:1.4rem;">0 hr</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card h-100">
            <div class="stat-icon tint-rose"><i class="bi bi-calendar-event"></i></div>
            <div class="stat-label">Upcoming Items</div>
            <div class="stat-value" id="statUpcoming" style="font-size:1.4rem;">0</div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card-soft card-pad h-100">
            <div class="section-title mb-3">Subject Progress</div>
            <div id="subjectProgressList"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card-soft card-pad h-100 d-flex flex-column justify-content-center align-items-center text-center">
            <div class="stat-label mb-2">Semester GPA</div>
            <div class="font-display" style="font-size:2.6rem;" id="statGpaProgress">—</div>
            <p class="text-faint small mt-2 mb-0">Calculated from subjects with a final grade entered.</p>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/progress.js"></script>
<script>
  msInitChrome("progress");
  msProgressInit();
</script>
</body>
</html>
