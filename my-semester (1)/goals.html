<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Semester — Goals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="goals">
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <div class="d-flex flex-column flex-grow-1 min-w-0">
    <div id="topbarSlot"></div>
    <main class="main-content">

      <div class="page-head">
        <div>
          <h1>Goals &amp; Habits</h1>
          <p class="subtitle">Small consistent actions, tracked weekly.</p>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card-soft card-pad h-100">
            <div class="section-head">
              <span class="section-title">My Goals</span>
              <button class="btn btn-brand btn-sm" onclick="msOpenGoalModal(null)"><i class="bi bi-plus-lg me-1"></i>Add Goal</button>
            </div>
            <div id="goalsList"></div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card-soft card-pad h-100">
            <div class="section-head">
              <span class="section-title">Habit Tracker</span>
              <div class="d-flex align-items-center gap-2">
                <span class="tag tag-sage" id="habitCompletionPct">0%</span>
                <button class="btn btn-outline-soft btn-sm" onclick="msOpenHabitModal()"><i class="bi bi-plus-lg me-1"></i>Habit</button>
              </div>
            </div>
            <div id="habitTrackerWrap" style="overflow-x:auto;"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Goal modal -->
<div class="modal fade" id="goalModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="goalForm" onsubmit="msSubmitGoalForm(event)" novalidate>
        <div class="modal-header">
          <h3 class="modal-title" id="goalModalTitle">Add Goal</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="goalId">
          <div class="was-validated-field">
            <label class="form-label" for="goalText">Goal</label>
            <input type="text" class="form-control" id="goalText" placeholder="e.g. Keep GPA above 3.6">
            <div class="invalid-msg">Please describe your goal.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save Goal</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Habit modal -->
<div class="modal fade" id="habitModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="habitForm" onsubmit="msSubmitHabitForm(event)" novalidate>
        <div class="modal-header">
          <h3 class="modal-title">Add Habit</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="was-validated-field">
            <label class="form-label" for="habitNameInput">Habit name</label>
            <input type="text" class="form-control" id="habitNameInput" placeholder="e.g. Read 20 minutes">
            <div class="invalid-msg">Please name the habit.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Add Habit</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/goals.js"></script>
<script>
  msInitChrome("goals");
  msGoalsInit();
</script>
</body>
</html>
