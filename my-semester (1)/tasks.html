<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Semester — Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tasks">
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <div class="d-flex flex-column flex-grow-1 min-w-0">
    <div id="topbarSlot"></div>
    <main class="main-content">

      <div class="page-head">
        <div>
          <h1>Tasks</h1>
          <p class="subtitle">Manage your tasks and never miss a deadline.</p>
        </div>
        <button class="btn btn-brand" onclick="msOpenTaskModal(null)"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
      </div>

      <div class="card-soft card-pad mb-3">
        <div class="row g-3 align-items-center">
          <div class="col-md-5">
            <input type="search" class="form-control" placeholder="Search tasks…" oninput="msSetTaskSearch(this.value)">
          </div>
          <div class="col-md-4">
            <div class="pill-group" id="taskFilterPills">
              <button class="pill-btn active" data-filter="all" onclick="msSetTaskFilter('all')">All</button>
              <button class="pill-btn" data-filter="today" onclick="msSetTaskFilter('today')">Today</button>
              <button class="pill-btn" data-filter="week" onclick="msSetTaskFilter('week')">This Week</button>
              <button class="pill-btn" data-filter="completed" onclick="msSetTaskFilter('completed')">Completed</button>
              <button class="pill-btn" data-filter="pending" onclick="msSetTaskFilter('pending')">Pending</button>
              <button class="pill-btn" data-filter="overdue" onclick="msSetTaskFilter('overdue')">Overdue</button>
            </div>
          </div>
          <div class="col-md-3">
            <select class="form-select" onchange="msSetTaskSort(this.value)">
              <option value="dueDate">Sort: Due date</option>
              <option value="priority">Sort: Priority</option>
              <option value="subject">Sort: Subject</option>
              <option value="completion">Sort: Completion</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card-soft card-pad">
        <div id="taskList"></div>
      </div>

    </main>
  </div>
</div>

<!-- Add/Edit task modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="taskForm" onsubmit="msSubmitTaskForm(event)" novalidate>
        <div class="modal-header">
          <h3 class="modal-title" id="taskModalTitle">Add Task</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="taskId">
          <div class="mb-3 was-validated-field">
            <label class="form-label" for="taskTitle">Task title</label>
            <input type="text" class="form-control" id="taskTitle" placeholder="e.g. Study inheritance">
            <div class="invalid-msg">Please enter a title.</div>
          </div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="taskSubject">Subject</label>
              <select class="form-select" id="taskSubject"></select>
            </div>
            <div class="col-sm-6 was-validated-field">
              <label class="form-label" for="taskDueDate">Due date</label>
              <input type="date" class="form-control" id="taskDueDate">
              <div class="invalid-msg">Please pick a due date.</div>
            </div>
            <div class="col-sm-6 was-validated-field">
              <label class="form-label" for="taskType">Type</label>
              <select class="form-select" id="taskType">
                <option value="">Choose…</option>
                <option>Study</option><option>Assignment</option><option>Quiz</option>
                <option>Revision</option><option>Project</option><option>Other</option>
              </select>
              <div class="invalid-msg">Please choose a type.</div>
            </div>
            <div class="col-sm-6 was-validated-field">
              <label class="form-label" for="taskPriority">Priority</label>
              <select class="form-select" id="taskPriority">
                <option value="">Choose…</option>
                <option>High</option><option>Medium</option><option>Low</option>
              </select>
              <div class="invalid-msg">Please choose a priority.</div>
            </div>
            <div class="col-sm-6 was-validated-field">
              <label class="form-label" for="taskEstMinutes">Estimated study time (minutes)</label>
              <input type="number" min="0" class="form-control" id="taskEstMinutes" placeholder="e.g. 60">
              <div class="invalid-msg">Study time can't be negative.</div>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label" for="taskNotes">Notes</label>
            <textarea class="form-control" id="taskNotes" rows="2" placeholder="Optional notes…"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/tasks.js"></script>
<script>
  msInitChrome("tasks");
  msTasksInit();
</script>
</body>
</html>
